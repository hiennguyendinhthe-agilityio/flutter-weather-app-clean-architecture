name: task_management_app
description: A task management app with Pomodoro timer functionality.

version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'
  flutter: ">=3.10.0"

# Flutter SDK
dependencies:
  flutter:
    sdk: flutter
  
  # UI
  cupertino_icons: ^1.0.6
  google_fonts: ^5.1.0
  flutter_svg: ^2.0.7
  percent_indicator: ^4.2.3
  shimmer: ^3.0.0
  lottie: ^2.6.0
  
  # State Management
  flutter_bloc: ^8.1.3
  equatable: ^2.0.5
  
  # Routing
  go_router: ^10.1.2
  
  # Local Storage
  shared_preferences: ^2.2.1
  sqflite: ^2.3.0
  path_provider: ^2.1.1
  
  # Date & Time
  intl: ^0.18.1
  
  # Utilities
  uuid: ^4.0.0
  collection: ^1.17.2
  rxdart: ^0.27.7
  
  # Animation
  flutter_animate: ^4.2.0
  
  # Dependency Injection
  get_it: ^7.6.4
  
  # Logging
  logger: ^2.0.2
  
  # Notifications
  flutter_local_notifications: ^15.1.1
  
  # Charts (for statistics)
  fl_chart: ^0.63.0

# Dev dependencies
dev_dependencies:
  flutter_test:
    sdk: flutter
  
  # Linting
  flutter_lints: ^2.0.3
  
  # Testing
  mockito: ^5.4.2
  bloc_test: ^9.1.4
  
  # Build
  build_runner: ^2.4.6
  
  # Icons
  flutter_launcher_icons: ^0.13.1
  
  # Native Splash Screen
  flutter_native_splash: ^2.3.2


# Settings Flutter
flutter:
  uses-material-design: true
  
  # Assets
  assets:
    - assets/images/
    - assets/icons/
    - assets/animations/
  
  # Fonts
  fonts:
    - family: SF Pro Display
      fonts:
        - asset: assets/fonts/SF-Pro-Display-Regular.otf
        - asset: assets/fonts/SF-Pro-Display-Medium.otf
          weight: 500
        - asset: assets/fonts/SF-Pro-Display-Semibold.otf
          weight: 600
        - asset: assets/fonts/SF-Pro-Display-Bold.otf
          weight: 700

# Generate app icon
flutter_launcher_icons:
  android: "launcher_icon"
  ios: true
  image_path: "assets/icons/app_icon.png"
  min_sdk_android: 21
  web:
    generate: true
    image_path: "assets/icons/app_icon.png"
  windows:
    generate: true
    image_path: "assets/icons/app_icon.png"
  macos:
    generate: true
    image_path: "assets/icons/app_icon.png"

# Generate native splash screen
flutter_native_splash:
  color: "#FFFFFF"
  image: assets/icons/splash_icon.png
  color_dark: "#121212"
  image_dark: assets/icons/splash_icon.png
  android_12:
    image: assets/icons/splash_icon_android12.png
    icon_background_color: "#FFFFFF"
    image_dark: assets/icons/splash_icon_android12.png
    icon_background_color_dark: "#121212"