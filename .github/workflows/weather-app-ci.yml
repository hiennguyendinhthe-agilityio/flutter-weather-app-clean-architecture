name: Weather App CI

on:
  push:
    branches: [ "main", "training-flutter-advance" ]
    paths:
      - 'apps/flutter_practice/weather_app/**'
      - '.github/workflows/weather-app-ci.yml'
  pull_request:
    branches: [ "main", "training-flutter-advance" ]
    paths:
      - 'apps/flutter_practice/weather_app/**'
      - '.github/workflows/weather-app-ci.yml'

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/flutter_practice/weather_app

    steps:
      - uses: actions/checkout@v4
      
      - name: Setup Java
        uses: actions/setup-java@v3
        with:
          distribution: 'zulu'
          java-version: '17'
          
      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'

      - name: Create mock env and firebase config for CI
        run: |
          echo "OWM_API_KEY=dummy_key_for_ci" > .env
          cat << 'EOF' > lib/firebase_options.dart
          import 'package:firebase_core/firebase_core.dart' show FirebaseOptions;
          import 'package:flutter/foundation.dart' show defaultTargetPlatform, kIsWeb, TargetPlatform;
          class DefaultFirebaseOptions {
            static FirebaseOptions get currentPlatform {
              return const FirebaseOptions(
                apiKey: 'dummy',
                appId: 'dummy',
                messagingSenderId: 'dummy',
                projectId: 'dummy',
              );
            }
          }
          EOF
          
      - name: Get dependencies
        run: flutter pub get
        
      - name: Analyze code
        run: flutter analyze
        
      - name: Build APK
        run: flutter build apk --debug
