    description: Run Flutter tests for a specific package in this project.
    packageFilters:
      flutter: true
      dirExists: test
      scope:
        - bazar_books_app

  test:
    run: melos run test:selective_unit_test --no-select
    description: Run all Flutter tests in this project.

  # Run unit test and generate html coverage (MacOS support for now)
  coverage:
    run: brew install lcov && melos run test
    description: Run unit testing and generate html coverage report.
    packageFilters:
      scope:
        - bazar_books_app

  # Run unit test, generate html coverage and open report (MacOS support for now)
  coverage:open-report:
    run: brew install lcov && melos run test && melos exec -- open coverage/html/index.html
    description: Run unit testing, generate and open html coverage report.
    packageFilters:
      scope:
        - bazar_books_app

  build_runner:
    run: |
      melos exec -- "puro flutter pub run build_runner build --delete-conflicting-outputs"
    packageFilters:
      ignore:
        - app_testing
        - reply
        - shrine
        - training_form
        - training_key
        - training_layout
