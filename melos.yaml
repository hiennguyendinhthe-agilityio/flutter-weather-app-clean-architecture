# The name of the project (required) is used for display purposes within IO environments and IDEs.
name: flutter_training

# A list of paths to local packages that are included in the Melos workspace. Each entry can be a specific path or a glob pattern.
packages:
  - apps/**
  - packages/**
  
scripts:
  postbootstrap: >
    melos exec -- puro flutter pub get

  # Clean all and remove Hanzo git hooks
  postclean: >
    melos exec -- puro flutter clean

  # Generation i18n file
  dev:generate:i18n:
    run: melos exec -- "puro flutter pub run intl_utils:generate"
    description: "Generation localizations"
    packageFilters:
      flutter: true
      scope:
        - bazar_books_app
        - bazar_books_design
       
  run:training_layout:
    run: melos exec -- puro flutter run -t lib/main.dart
    packageFilters:
      scope:
        - training_layout
  # Unit testing scripts
